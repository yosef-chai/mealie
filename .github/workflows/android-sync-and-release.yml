name: Android sync and release

# מסנכרן את הפורק עם Mealie, ובכל גרסה רשמית חדשה במקור בונה APK חתום ומפרסם אותו כ-Release.
# האפליקציה מתעדכנת מה-Release האחרון כאן (releases/latest).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      bump_app_patch:
        description: "App-only fix: release the current Mealie version again with the next app patch number"
        type: boolean
        default: false
      mealie_tag:
        description: "Build a specific upstream tag (for example v3.31.0). Empty means the latest release."
        type: string
        required: false

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  UPSTREAM: mealie-recipes/mealie

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # merge-upstream דורש טוקן עם Contents + Workflows: GITHUB_TOKEN לא יכול לעדכן קבצי workflow.
      - name: Merge upstream into mealie-next
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SYNC_TOKEN is not set; skipping branch sync. Releases still build from the upstream tag."
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=mealie-next --jq '"merge: " + .merge_type + " " + (.message // "")'

      # workflows שהגיעו מהמקור (docker, release, nightly...) לא רצים בפורק.
      # PAT כן מפעיל אירועי push, ולכן גם מבטלים ריצות שהסנכרון התחיל.
      - name: Disable upstream workflows and cancel their runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all -R "$GITHUB_REPOSITORY" --json id,path,state \
            --jq '.[] | select(.state == "active") | select(.path | test("^\\.github/workflows/android-") | not) | .id' |
            while read -r id; do
              gh workflow disable "$id" -R "$GITHUB_REPOSITORY" && echo "disabled workflow $id"
            done
          for status in queued in_progress waiting requested pending; do
            gh run list -R "$GITHUB_REPOSITORY" --status "$status" --limit 100 --json databaseId,workflowName \
              --jq '.[] | select(.workflowName | startswith("Android") | not) | .databaseId' |
              while read -r run; do
                gh run cancel "$run" -R "$GITHUB_REPOSITORY" && echo "cancelled run $run"
              done
          done

  plan:
    name: Decide what to release
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      version: ${{ steps.plan.outputs.version }}
      app_patch: ${{ steps.plan.outputs.app_patch }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Compare upstream releases with fork releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump_app_patch || false }}
          WANTED: ${{ inputs.mealie_tag }}
        run: |
          set -euo pipefail
          if [ -n "$WANTED" ]; then
            UPSTREAM_TAG="$WANTED"
          else
            UPSTREAM_TAG=$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)
          fi
          VERSION="${UPSTREAM_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream tag '$UPSTREAM_TAG'"
            exit 1
          fi
          ESCAPED="${VERSION//./\\.}"
          EXISTING=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' |
            grep -E "^android-v${ESCAPED}(\.[0-9]+)?$" || true)

          BUILD=true
          PATCH=0
          if [ -z "$EXISTING" ]; then
            [ "$BUMP" = "true" ] && echo "::notice::No release for $VERSION yet, so this builds it with appPatch=0."
          elif [ "$BUMP" = "true" ]; then
            # תגית בלי סיומת היא N=0; לוקחים את המקסימום ומוסיפים 1.
            MAX=$(echo "$EXISTING" | sed -E "s/^android-v${ESCAPED}(\.([0-9]+))?$/\2/" | sed 's/^$/0/' | sort -n | tail -1)
            PATCH=$((MAX + 1))
          else
            BUILD=false
            echo "Release for Mealie $VERSION already exists; nothing to do."
          fi
          if [ "$PATCH" -gt 99 ]; then
            echo "::error::appPatch would exceed 99"
            exit 1
          fi
          TAG="android-v$VERSION"
          [ "$PATCH" -gt 0 ] && TAG="$TAG.$PATCH"
          {
            echo "build=$BUILD"
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "version=$VERSION"
            echo "app_patch=$PATCH"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: build=$BUILD tag=$TAG (Mealie $UPSTREAM_TAG, appPatch=$PATCH)"

  build:
    name: Build signed APK
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout fork (Android sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mealie-next

      - name: Record source commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # התרגומים נלקחים מהתגית ששוחררה במקור, לא מ-mealie-next (שעשוי להכיל קוד שעוד לא שוחרר).
      - name: Checkout upstream translations at the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.plan.outputs.upstream_tag }}
          path: upstream
          sparse-checkout: frontend/app/lang
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build release APK
        working-directory: android
        env:
          MEALIE_REQUIRE_SIGNING: "true"
          MEALIE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MEALIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEALIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEALIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease --stacktrace
          -PmealieVersion=${{ needs.plan.outputs.version }}
          -PappPatch=${{ needs.plan.outputs.app_patch }}
          -PupdateRepo=${{ github.repository }}
          -PmealieLangDir=../upstream/frontend/app/lang/messages

      - name: Verify signature and write checksums
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          if [ -n "$EXPECTED_CERT" ]; then
            ACTUAL=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/signature.txt" | awk '{print $NF}')
            if [ "${ACTUAL,,}" != "${EXPECTED_CERT,,}" ]; then
              echo "::error::Signing certificate changed: $ACTUAL"
              exit 1
            fi
          fi
          mkdir -p dist
          cp "$APK" dist/mealie-android.apk
          (cd dist && sha256sum mealie-android.apk > checksums.txt && cat checksums.txt)

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-apk
          path: dist/
          retention-days: 30

  ui-check:
    name: Mobile layer check against Mealie ${{ needs.plan.outputs.upstream_tag }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mealie:
        image: ghcr.io/mealie-recipes/mealie:${{ needs.plan.outputs.upstream_tag }}
        ports:
          - 9000:9000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mealie-next
          sparse-checkout: |
            android/ci
            android/app/src/main/assets

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Playwright
        working-directory: android/ci
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for Mealie
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:9000/api/app/about && exit 0
            sleep 2
          done
          echo "::error::Mealie did not start"
          exit 1

      - name: Run checks
        working-directory: android/ci
        run: npx playwright test

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-check
          path: |
            android/ci/screenshots/
            android/ci/playwright-report/
          retention-days: 14

  release:
    name: Publish release
    needs: [plan, build, ui-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-apk
          path: dist

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
          APP_PATCH: ${{ needs.plan.outputs.app_patch }}
        run: |
          {
            echo "Android app for Mealie $UPSTREAM_TAG."
            if [ "$APP_PATCH" != "0" ]; then echo; echo "App-only update $APP_PATCH on top of Mealie $UPSTREAM_TAG."; fi
            echo
            echo "Install \`mealie-android.apk\` once; after that the app updates itself from this page."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/checksums.txt)\`"
            echo
            echo "## Mealie $UPSTREAM_TAG"
            echo
            gh release view "$UPSTREAM_TAG" -R "$UPSTREAM" --json body --jq .body
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          APP_PATCH: ${{ needs.plan.outputs.app_patch }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          NAME="Mealie for Android $VERSION"
          [ "$APP_PATCH" != "0" ] && NAME="$NAME ($APP_PATCH)"
          gh release create "$TAG" dist/mealie-android.apk dist/checksums.txt \
            -R "$GITHUB_REPOSITORY" --target "$SHA" --title "$NAME" --notes-file notes.md --latest
