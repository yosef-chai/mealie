name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - "frontend/app/lang/messages/**"
      - ".github/workflows/android-*.yml"
  push:
    branches: [mealie-next]
    paths:
      - "android/**"
      - "frontend/app/lang/messages/**"
      - ".github/workflows/android-*.yml"
  # פעם בשבוע מול גרסת ה-nightly של Mealie: שינוי בממשק או בתרגומים במקור מתגלה לפני השחרור הבא
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # generateMealieStrings רץ כחלק מהבנייה ונכשל על תרגום עם placeholders שבורים.
      - name: Generate strings, lint, unit tests, debug build
        run: ./gradlew :app:generateMealieStrings :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mealie-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  scripts:
    # הסקריפטים שהאפליקציה מזריקה: זיהוי זמני בישול, חילוץ מתכון מדף, ושכבת המובייל מול שרת Mealie אמיתי
    name: Injected scripts
    runs-on: ubuntu-latest
    services:
      mealie:
        image: ghcr.io/mealie-recipes/mealie:${{ github.event_name == 'schedule' && 'nightly' || 'latest' }}
        ports:
          - 9000:9000
    defaults:
      run:
        working-directory: android/ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            android/ci
            android/app/src/main/assets

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cooking time parser
        run: node --test timers.test.mjs

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for Mealie
        run: |
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:9000/api/app/about && exit 0
            sleep 2
          done
          echo "::error::Mealie did not start"
          exit 1

      - name: Recipe extraction and mobile layer
        run: npx playwright test

      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-check
          path: |
            android/ci/screenshots/
            android/ci/playwright-report/
          retention-days: 14
